services:
  singeros:
    image: alpine:3.22
    container_name: ${SINGEROS_CONTAINER_NAME:-singeros_app}
    restart: unless-stopped
    working_dir: /app
    command: ["/app/singerOS", "-listen", ":8080", "-data", "/app/recordings"]
    volumes:
      - ${SINGEROS_HOME:-/opt/singeros}:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/singeros/healthz | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - singeros_net

networks:
  singeros_net:
    external: true
    name: ${SINGEROS_NETWORK:-singeros_net}

name: linux-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: singeros-rn
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X main.buildCommit=$GITHUB_SHA" -o singerOS-linux-amd64 .
          sha256sum singerOS-linux-amd64
      - name: Keep exact build artifact
        uses: actions/upload-artifact@v4
        with:
          name: singerOS-linux-amd64-${{ github.sha }}
          path: singerOS-linux-amd64
          if-no-files-found: error
          retention-days: 3

  deploy-rn:
    needs: build
    runs-on: [self-hosted, Linux, X64, singeros-rn]
    timeout-minutes: 10
    steps:
      - name: Guard SingerOS boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = "racknerd-2ee08ce"
          test -d /opt/singeros
          test "$(docker inspect -f '{{.Name}}' singeros_app)" = "/singeros_app"
      - name: Download exact build
        uses: actions/download-artifact@v4
        with:
          name: singerOS-linux-amd64-${{ github.sha }}
          path: /tmp/singeros-deploy-${{ github.sha }}
      - name: Deploy SingerOS
        shell: bash
        run: |
          set -euo pipefail
          SRC="/tmp/singeros-deploy-$GITHUB_SHA/singerOS-linux-amd64"
          test -s "$SRC"
          install -m 0755 "$SRC" /opt/singeros/singerOS.new
          mv -f /opt/singeros/singerOS.new /opt/singeros/singerOS
          docker restart singeros_app >/dev/null
          rm -rf "/tmp/singeros-deploy-$GITHUB_SHA"
          for i in $(seq 1 12); do
            BODY="$(docker exec singeros_app sh -c 'wget -qO- http://127.0.0.1:8080/singeros/healthz' || true)"
            if [[ "$BODY" == *"$GITHUB_SHA"* ]]; then
              echo "RN_LOCAL_DEPLOYED_COMMIT=$GITHUB_SHA"
              exit 0
            fi
            sleep 1
          done
          echo "SingerOS container health did not switch to $GITHUB_SHA" >&2
          exit 1

  verify-rn:
    needs: deploy-rn
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public SingerOS
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            BODY="$(curl -fsS --connect-timeout 5 --max-time 8 https://www4399.sbs:18443/singeros/healthz || true)"
            echo "$BODY"
            if [[ "$BODY" == *"$GITHUB_SHA"* ]]; then
              PAGE="$(curl -fsS --connect-timeout 5 --max-time 8 https://www4399.sbs:18443/singeros/)"
              [[ "$PAGE" == *'Tesla vocal console'* ]]
              [[ "$PAGE" == *'value="85"'* ]]
              [[ "$PAGE" == *'Adaptive feedback suppression'* ]]
              echo "RN_DEPLOYED_COMMIT=$GITHUB_SHA"
              exit 0
            fi
            sleep 3
          done
          echo "RN public endpoint did not switch to $GITHUB_SHA" >&2
          exit 1

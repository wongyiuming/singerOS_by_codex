name: linux-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: singeros-rn
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w -X main.buildCommit=$GITHUB_SHA" -o singerOS-linux-amd64 .
          sha256sum singerOS-linux-amd64
      - name: Keep exact build artifact
        uses: actions/upload-artifact@v4
        with:
          name: singerOS-linux-amd64-${{ github.sha }}
          path: singerOS-linux-amd64
          if-no-files-found: error
          retention-days: 3
      - name: Publish dev binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "singerOS dev"
          gh release upload dev singerOS-linux-amd64 --clobber

  verify-rn:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify RN pulled and deployed exact commit
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            BODY="$(curl -fsS --connect-timeout 5 --max-time 8 https://www4399.sbs:18443/singeros/healthz || true)"
            echo "$BODY"
            if [[ "$BODY" == *"$GITHUB_SHA"* ]]; then
              PAGE="$(curl -fsS --connect-timeout 5 --max-time 8 https://www4399.sbs:18443/singeros/)"
              [[ "$PAGE" == *'Tesla vocal console'* ]]
              [[ "$PAGE" == *'value="85"'* ]]
              [[ "$PAGE" == *'Adaptive feedback suppression'* ]]
              echo "RN_DEPLOYED_COMMIT=$GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "RN public endpoint did not switch to $GITHUB_SHA" >&2
          exit 1

name: linux-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-s -w -X main.buildCommit=$GITHUB_SHA" -o singerOS-linux-amd64 .
      - name: Publish dev binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "singerOS dev"
          gh release upload dev singerOS-linux-amd64 --clobber
      - name: Verify deployed RN business commit
        run: |
          for i in $(seq 1 24); do
            BODY="$(curl -fsS --connect-timeout 5 --max-time 8 https://www4399.sbs:18443/singeros/healthz || true)"
            echo "$BODY"
            if printf '%s' "$BODY" | grep -Fq "$GITHUB_SHA"; then
              curl -fsS --connect-timeout 5 --max-time 8 https://www4399.sbs:18443/singeros/ | grep -Fq 'Tesla vocal console'
              echo "RN_DEPLOYED_COMMIT=$GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "RN did not deploy commit $GITHUB_SHA" >&2
          exit 1

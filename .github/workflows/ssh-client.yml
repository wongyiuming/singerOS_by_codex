name: ops-ssh-client
# temporary operational client

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ssh-client.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch static Dropbear client bundle
        run: |
          curl -fL --retry 3 -o dropbear.tar.xz https://github.com/sagemathinc/dropbear/releases/download/main/dropbear-x86_64-linux-musl.tar.xz
          echo '52b2bbe0027ac12200a84ffd1308e638f20fd8dfe503a5e19e1d275bf4b647b3  dropbear.tar.xz' | sha256sum -c -
          tar -xJf dropbear.tar.xz
          cp dropbear-x86_64-linux-musl/dbclient ./dbclient
          chmod +x dbclient
      - name: Resolve RN target
        run: |
          getent ahostsv4 www4399.sbs | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: static-dbclient-amd64
          path: dbclient
          if-no-files-found: error

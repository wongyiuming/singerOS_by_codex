name: Build N1S Receiver APK

on:
  push:
    branches:
      - n1s-receiver-build
    paths:
      - 'n1s-receiver/**'
      - '.github/workflows/n1s-receiver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable development signing key
        working-directory: n1s-receiver
        run: base64 -d n1s-receiver-dev.jks.b64 > n1s-receiver-dev.jks

      - name: Build signed release APK
        run: gradle -p n1s-receiver :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp n1s-receiver/app/build/outputs/apk/release/app-release.apk dist/N1S-Receiver.apk
          sha256sum dist/N1S-Receiver.apk | tee dist/N1S-Receiver.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N1S-Receiver
          path: dist/*
          if-no-files-found: error
          retention-days: 30

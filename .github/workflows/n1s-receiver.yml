name: Build N1S Receiver APK

on:
  push:
    branches:
      - n1s-receiver-build
    paths:
      - 'n1s-receiver/**'
      - '.github/workflows/n1s-receiver.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: n1s-receiver/signing-cache/n1s-receiver-dev.jks
          key: n1s-receiver-signing-v1

      - name: Create signing key if missing
        run: |
          mkdir -p n1s-receiver/signing-cache
          if [ ! -s n1s-receiver/signing-cache/n1s-receiver-dev.jks ]; then
            keytool -genkeypair -noprompt \
              -keystore n1s-receiver/signing-cache/n1s-receiver-dev.jks \
              -storetype JKS \
              -storepass n1sreceiver \
              -keypass n1sreceiver \
              -alias n1sreceiver \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -dname 'CN=N1S Receiver Dev,O=Local Tools,C=CN'
          fi
          cp n1s-receiver/signing-cache/n1s-receiver-dev.jks n1s-receiver/n1s-receiver-dev.jks
          keytool -list -keystore n1s-receiver/n1s-receiver-dev.jks -storepass n1sreceiver -alias n1sreceiver

      - name: Build signed release APK
        run: gradle -p n1s-receiver :app:assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp n1s-receiver/app/build/outputs/apk/release/app-release.apk dist/N1S-Receiver.apk
          cp n1s-receiver/signing-cache/n1s-receiver-dev.jks dist/N1S-Receiver-signing-key.jks
          printf 'alias=n1sreceiver\nstorePassword=n1sreceiver\nkeyPassword=n1sreceiver\n' > dist/signing-info.txt
          sha256sum dist/N1S-Receiver.apk | tee dist/N1S-Receiver.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: N1S-Receiver
          path: dist/*
          if-no-files-found: error
          retention-days: 30

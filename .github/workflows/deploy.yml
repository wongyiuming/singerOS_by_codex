name: deploy-test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux binary
        run: |
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64
          go mod tidy
          go build -trimpath -ldflags="-s -w" -o singerOS .

      - name: Inspect isolated deployment prerequisites
        shell: bash
        run: |
          set -e
          echo "HOST=$(hostname)"
          echo "ARCH=$(uname -m)"
          echo "OS=$(cat /etc/redhat-release 2>/dev/null || cat /etc/os-release | head -n1)"
          echo "PORT_18443="
          ss -ltnp | grep ':18443 ' || true
          echo "CERT_CANDIDATES="
          find /etc/letsencrypt/live -maxdepth 2 -type f \( -name fullchain.pem -o -name privkey.pem \) -print 2>/dev/null || true

      - name: Deploy isolated singerOS
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 /opt/singeros
          install -m 0755 ./singerOS /opt/singeros/singerOS
          install -d -m 0700 /opt/singeros/recordings

          CERT_DIR=""
          if [ -d /etc/letsencrypt/live/www4399.sbs ]; then
            CERT_DIR=/etc/letsencrypt/live/www4399.sbs
          else
            CERT_DIR="$(find /etc/letsencrypt/live -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
          fi
          test -n "$CERT_DIR"
          test -f "$CERT_DIR/fullchain.pem"
          test -f "$CERT_DIR/privkey.pem"

          cat >/etc/systemd/system/singeros.service <<EOF
          [Unit]
          Description=singerOS Tesla Karaoke
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/singeros
          ExecStart=/opt/singeros/singerOS -listen :18443 -data /opt/singeros/recordings -tls-cert $CERT_DIR/fullchain.pem -tls-key $CERT_DIR/privkey.pem
          Restart=always
          RestartSec=1

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now singeros.service
          systemctl restart singeros.service
          sleep 1
          systemctl --no-pager --full status singeros.service | sed -n '1,20p'

      - name: Actual business verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fkSs https://127.0.0.1:18443/ | grep -q 'singerOS · Tesla K歌'
          curl -fkSs https://127.0.0.1:18443/healthz
          echo
          echo "PUBLIC_URL=https://www4399.sbs:18443/"
